name: Flutter Build & Init

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean & Get Packages
        run: |
          flutter clean
          flutter pub get

      - name: Build Universal APK (For 2GB, 4GB, 8GB & PC)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dubbing-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk