name: Flutter Build & Init

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean & Get Packages
        run: |
          flutter clean
          flutter pub get

      - name: Build Lightweight Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload Lightweight APKs
        uses: actions/upload-artifact@v4
        with:
          name: Dubbing-App-Small-APKs
          path: build/app/outputs/flutter-apk/*.apk